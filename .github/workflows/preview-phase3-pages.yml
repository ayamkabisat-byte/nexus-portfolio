name: Preview Phase 3.5 on GitHub Pages

on:
  push:
    branches:
      - phase-3.5/lucidreamer-capture-world-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phase3-5-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://ayamkabisat-byte.github.io/nexus-portfolio
      BASE_PATH: /nexus-portfolio
    steps:
      - name: Checkout Phase 3.5 preview branch
        uses: actions/checkout@v4
      - name: Build Astro preview
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
