name: Validate Phase 3.5 Book Worlds

on:
  push:
    branches:
      - phase-3.5/lucidreamer-capture-world-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-5-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3.5 branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check and static build
        run: pnpm run build
